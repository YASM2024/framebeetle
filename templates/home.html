{% extends "base.html" %}
{% block content %}
<h2 class="h4 mb-4">メニュー</h2>
<p class="text-muted">利用するフォームを選んでください。新しいフォームは <code>forms</code> フォルダに YAML ファイルを追加するだけで作成できます。</p>

{% if forms %}
<div class="row g-3">
    {% for form in forms %}
    <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <h3 class="h5 card-title">{{ form.title }}</h3>
                <p class="card-text text-muted small flex-fill">{{ form.get('description', '') }}</p>
                <a href="{{ url_for('form_list', form_id=form.id) }}" class="btn btn-primary">開く</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-info">利用可能なフォームがありません。管理者に連絡してください。</div>
{% endif %}
{% endblock %}
